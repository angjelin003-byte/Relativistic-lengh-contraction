name: Build Android APK with Gradle and Python

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android APK with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK for Mobile Download
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/Relativistic-Length-Contraction-0.99999999999c.apk
            echo "Successfully prepared APK: $APK_PATH"
            ls -lh build-artifacts/
          else
            echo "Error: No APK found after build"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relativistic-Length-Contraction-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct Mobile APK Download)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Relativistic Length Contraction 3D (Android APK)"
          body: |
            ## 📱 Relativistic Length Contraction 3D for Android
            Interactive Special Relativity cube deformation up to **0.99999999999 c** ($\gamma \approx 223,607$).

            ### ⬇️ Direct Mobile Download
            Tap the **`Relativistic-Length-Contraction-0.99999999999c.apk`** file below directly in your mobile browser to download and install on Android!
            
            - **Physics & Visual Features**:
              - Relativistic flattening along axis of motion ($X, Y, Z$)
              - Transparent atom grip points lattice demonstrating longitudinal packing ($\rho = \rho_0 \times \gamma$)
              - Ghost rigid reference cube ($L_0 = 1.0\text{ m}$)
              - Python Lorentz physics engine
          files: build-artifacts/Relativistic-Length-Contraction-0.99999999999c.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
